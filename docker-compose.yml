services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - 1433:1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  crud.user.api:
    build: ../Crud.Users.Api
    image: crud.user.api
    ports:
      - 3000:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CrudUsers;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - SecurityAuth__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  crud.user.ui:
    build: ../Crud.Users.Ui
    image: crud.user.ui
    ports:
      - 3001:3000
    environment:
      - Environment=Testing
    depends_on:
      - crud.user.api
    restart: unless-stopped

volumes:
  sqlserver-data:
  mongo-data:
